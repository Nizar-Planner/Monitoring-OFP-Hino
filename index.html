<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hino OFP Monitoring & Tracking Dashboard</title>
    <meta name="description" content="Dashboard monitoring dan tracking Original Failure Part (OFP) Hino Motors untuk memantau alur klaim Dealer -> HMSI -> HMMI/HML secara otomatis." />
    <meta property="og:title" content="Hino OFP Monitoring & Tracking Dashboard" />
    <meta property="og:description" content="Dashboard monitoring dan tracking Original Failure Part (OFP) Hino Motors untuk memantau alur klaim Dealer -> HMSI -> HMMI/HML secara otomatis." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      // Gracefully suppress benign Vite HMR WebSocket connection errors in sandbox iframe environment
      (function() {
        var origError = console.error;
        console.error = function() {
          var msg = arguments[0] ? String(arguments[0]) : '';
          if (msg.includes('[vite]') || msg.includes('WebSocket') || msg.includes('failed to connect')) return;
          origError.apply(console, arguments);
        };
        var origWarn = console.warn;
        console.warn = function() {
          var msg = arguments[0] ? String(arguments[0]) : '';
          if (msg.includes('[vite]') || msg.includes('WebSocket') || msg.includes('failed to connect')) return;
          origWarn.apply(console, arguments);
        };
      })();
      window.addEventListener('error', function (event) {
        if (
          event.message &&
          (event.message.includes('WebSocket') ||
           event.message.includes('createWebSocketModuleRunnerTransport') ||
           event.message.includes('failed to connect') ||
           (event.filename && event.filename.includes('@vite/client')))
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        var str = String((event.reason && (event.reason.stack || event.reason)) || '');
        if (
          str.includes('WebSocket') ||
          str.includes('@vite/client') ||
          str.includes('createWebSocketModuleRunnerTransport')
        ) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
