<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hino OFP Monitoring & Tracking Dashboard</title>
    <meta name="description" content="Dashboard monitoring dan tracking Original Failure Part (OFP) Hino Motors untuk memantau alur klaim Dealer -> HMSI -> HMMI/HML secara otomatis." />
    <meta property="og:title" content="Hino OFP Monitoring & Tracking Dashboard" />
    <meta property="og:description" content="Dashboard monitoring dan tracking Original Failure Part (OFP) Hino Motors untuk memantau alur klaim Dealer -> HMSI -> HMMI/HML secara otomatis." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        var origError = console.error;
        console.error = function() {
          var msg = arguments[0] ? String(arguments[0]) : '';
          if (msg.includes('[vite]') || msg.includes('WebSocket') || msg.includes('failed to connect') || msg.includes('24678')) return;
          origError.apply(console, arguments);
        };
        var origWarn = console.warn;
        console.warn = function() {
          var msg = arguments[0] ? String(arguments[0]) : '';
          if (msg.includes('[vite]') || msg.includes('WebSocket') || msg.includes('failed to connect') || msg.includes('24678')) return;
          origWarn.apply(console, arguments);
        };
        window.addEventListener('error', function (event) {
          if (
            event.message &&
            (event.message.includes('WebSocket') ||
             event.message.includes('createWebSocketModuleRunnerTransport') ||
             event.message.includes('failed to connect') ||
             (event.filename && event.filename.includes('@vite/client')))
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var str = String((event.reason && (event.reason.stack || event.reason)) || '');
          if (
            str.includes('WebSocket') ||
            str.includes('@vite/client') ||
            str.includes('createWebSocketModuleRunnerTransport')
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);

        var NativeWS = window.WebSocket;
        if (!NativeWS) return;
        function MockHmrWebSocket(url, protocols) {
          if (protocols === 'vite-hmr' || (typeof url === 'string' && (url.includes('token=') || url.includes('24678') || url.includes('vite')))) {
            this.readyState = 1;
            this.OPEN = 1;
            this.CONNECTING = 0;
            this.CLOSING = 2;
            this.CLOSED = 3;
            this.binaryType = 'blob';
            this.bufferedAmount = 0;
            this.extensions = '';
            this.protocol = 'vite-hmr';
            this.url = url;
            this.send = function() {};
            this.close = function() {};
            this.addEventListener = function(type, listener) {
              if (type === 'open') {
                setTimeout(function() {
                  try {
                    if (typeof listener === 'function') listener({ type: 'open' });
                    else if (listener && typeof listener.handleEvent === 'function') listener.handleEvent({ type: 'open' });
                  } catch(e) {}
                }, 0);
              }
            };
            this.removeEventListener = function() {};
            this.dispatchEvent = function() { return true; };
            return this;
          }
          return new NativeWS(url, protocols);
        }
        MockHmrWebSocket.prototype = NativeWS.prototype;
        MockHmrWebSocket.CONNECTING = 0;
        MockHmrWebSocket.OPEN = 1;
        MockHmrWebSocket.CLOSING = 2;
        MockHmrWebSocket.CLOSED = 3;
        window.WebSocket = MockHmrWebSocket;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
